# Copy to compose.local.yaml (git-ignored) and start with:
#   docker compose -f compose.yaml -f compose.local.yaml up --build -d
# Secrets are FILES, never environment variables or tracked content (contavex convention).
services:
  motionex:
    secrets:
      - elevenlabs_api_key          # enables voice.elevenlabs and voice.elevenlabs-voices
    volumes:
      - ./fonts:/fonts:ro            # extra fonts (e.g. Google Fonts .ttf files) for offline renders
      - ./voices-extra:/voices:ro    # extra Piper voices (<name>.onnx + <name>.onnx.json)
secrets:
  elevenlabs_api_key:
    file: ./secrets/elevenlabs_api_key
