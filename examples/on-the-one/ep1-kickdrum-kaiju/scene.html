<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ON THE ONE - EP1 KICKDRUM KAIJU</title>
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="stage" width="1080" height="1920"></canvas>
<script>
(() => {
'use strict';

// =====================================================================================
// ON THE ONE - EP1 "KICKDRUM KAIJU"
// neon vector wireframe city, a creature built of speaker cones, 132 bpm hard techno.
// Every frame is a pure function of t: no Math.random, no Date, no timers.
// =====================================================================================

const W = 1080, H = 1920;
const BPM = 132, BPB = 4;
const SPB = 60 / BPM;          // 0.45454545 s per beat
const BAR = SPB * BPB;         // 1.8181818  s per bar
const NBARS = 14;
const DUR = NBARS * BAR;       // 25.45454 s
const barT = (n) => (n - 1) * BAR;      // 1-based bar number -> seconds
const DROP_T = barT(7);                 // 10.90909 = the drop
const FPS = 30;

const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');

// ---------------------------------------------------------------- math helpers
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, x) => a + (b - a) * x;
const smooth = (a, b, x) => { const u = clamp((x - a) / (b - a), 0, 1); return u * u * (3 - 2 * u); };
const hash = (i, j) => { const h = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return h - Math.floor(h); };
const TAU = Math.PI * 2;

// ---------------------------------------------------------------- the grid
const beatF = (t) => t / SPB;
const kickPhase = (t) => { const b = t / SPB; return b - Math.floor(b); };
const kickIndex = (t) => Math.round(t / SPB);
/** decaying pulse that restarts on every kick */
const kickPulse = (t, k = 9) => Math.exp(-kickPhase(t) * k);
/** decaying pulse on every 8th-note hat */
const hatPulse = (t, k = 15) => { const p = (t / (SPB / 2)) % 1; return Math.exp(-p * k); };
/** overall energy 0..1: low in the intro, 1 after the drop */
const energy = (t) => 0.18 + 0.82 * smooth(DROP_T, DROP_T + 0.35, t);
/** 0 = crouched, 1 = standing tall */
const standAt = (t) =>
  0.40 + 0.16 * smooth(barT(6) + 1.0, DROP_T, t) + 0.44 * smooth(DROP_T, DROP_T + 0.6, t);
/** the camera shake amplitude of the current shot multiplier, restarts on every kick */
const shakeAt = (t, amp) => amp * (0.55 * kickPulse(t, 11) + 0.45 * Math.exp(-kickPhase(t) * 3.2));

// =====================================================================================
// camera + perspective projection
// =====================================================================================
function makeCam(eye, look, fovDeg, roll) {
  let fx = look.x - eye.x, fy = look.y - eye.y, fz = look.z - eye.z;
  const fl = Math.hypot(fx, fy, fz) || 1;
  fx /= fl; fy /= fl; fz /= fl;
  // right = up x forward   (up = world +y, forward = view direction)
  let rx = 1 * fz - 0 * fy, ry = 0 * fx - 0 * fz, rz = 0 * fy - 1 * fx; // (0,1,0) x f
  const rl = Math.hypot(rx, ry, rz) || 1;
  rx /= rl; ry /= rl; rz /= rl;
  // up = forward x right
  const ux = fy * rz - fz * ry, uy = fz * rx - fx * rz, uz = fx * ry - fy * rx;
  return {
    ex: eye.x, ey: eye.y, ez: eye.z,
    fx, fy, fz, rx, ry, rz, ux, uy, uz,
    fpx: (H / 2) / Math.tan((fovDeg * Math.PI) / 360),
    cr: Math.cos(roll), sr: Math.sin(roll),
  };
}
const NEAR = 0.42;
/** camera-space depth of a world point */
const cdz = (cam, x, y, z) => (x - cam.ex) * cam.fx + (y - cam.ey) * cam.fy + (z - cam.ez) * cam.fz;
function toScreen(cam, x, y, z) {
  const dx = x - cam.ex, dy = y - cam.ey, dz = z - cam.ez;
  const vz = dx * cam.fx + dy * cam.fy + dz * cam.fz;
  if (vz <= NEAR) return null;
  const vx = dx * cam.rx + dy * cam.ry + dz * cam.rz;
  const vy = dx * cam.ux + dy * cam.uy + dz * cam.uz;
  let sx = W / 2 + (cam.fpx * vx) / vz;
  let sy = H / 2 - (cam.fpx * vy) / vz;
  if (cam.sr) {
    const ox = sx - W / 2, oy = sy - H / 2;
    sx = W / 2 + ox * cam.cr - oy * cam.sr;
    sy = H / 2 + ox * cam.sr + oy * cam.cr;
  }
  return { x: sx, y: sy, z: vz };
}
/** project a segment, clipping it at the near plane. returns [pa, pb, z] or null */
function seg(cam, ax, ay, az, bx, by, bz) {
  let za = cdz(cam, ax, ay, az), zb = cdz(cam, bx, by, bz);
  if (za <= NEAR && zb <= NEAR) return null;
  if (za <= NEAR) {
    const k = (NEAR - za) / (zb - za);
    ax = lerp(ax, bx, k); ay = lerp(ay, by, k); az = lerp(az, bz, k); za = NEAR;
  } else if (zb <= NEAR) {
    const k = (NEAR - zb) / (za - zb);
    bx = lerp(bx, ax, k); by = lerp(by, ay, k); bz = lerp(bz, az, k); zb = NEAR;
  }
  const pa = toScreen(cam, ax, ay, az), pb = toScreen(cam, bx, by, bz);
  if (!pa || !pb) return null;
  return [pa, pb, (za + zb) * 0.5];
}
function line(cam, a, b) { seg(cam, a.x, a.y, a.z, b.x, b.y, b.z); }
function strokeSeg(cam, a, b) {
  const s = line(cam, a, b);
  if (!s) return;
  ctx.beginPath();
  ctx.moveTo(s[0].x, s[0].y);
  ctx.lineTo(s[1].x, s[1].y);
  ctx.stroke();
}
/** world circle -> world points. plane 'y' = horizontal, 'z' = facing +z, 'x' = facing +x */
function circle(cx, cy, cz, r, segs, plane) {
  const out = [];
  for (let i = 0; i < segs; i++) {
    const a = (i / segs) * TAU;
    const c = Math.cos(a) * r, s2 = Math.sin(a) * r;
    if (plane === 'y') out.push({ x: cx + c, y: cy, z: cz + s2 });
    else if (plane === 'z') out.push({ x: cx + c, y: cy + s2, z: cz });
    else out.push({ x: cx, y: cy + c, z: cz + s2 });
  }
  return out;
}
function poly(cam, pts, close) {
  const sp = [];
  for (const p of pts) { const q = toScreen(cam, p.x, p.y, p.z); if (!q) return null; sp.push(q); }
  ctx.beginPath();
  ctx.moveTo(sp[0].x, sp[0].y);
  for (let i = 1; i < sp.length; i++) ctx.lineTo(sp[i].x, sp[i].y);
  if (close) ctx.closePath();
  return sp;
}
const polyStroke = (cam, pts, close) => { if (poly(cam, pts, close)) ctx.stroke(); };
/** stroke a world polyline, breaking it where points fall behind the near plane */
function softStroke(cam, pts) {
  ctx.beginPath();
  let started = false;
  for (const p of pts) {
    const q = toScreen(cam, p.x, p.y, p.z);
    if (!q) { started = false; continue; }
    if (!started) { ctx.moveTo(q.x, q.y); started = true; } else ctx.lineTo(q.x, q.y);
  }
  ctx.stroke();
}

// =====================================================================================
// the world
// =====================================================================================
const CITY = (() => {
  const r = mulberry32(20261106);
  const out = [];
  const ring = (n, r0, r1, h0, h1, hx, phase, hue) => {
    for (let i = 0; i < n; i++) {
      const a = phase + (i / n) * TAU + (r() - 0.5) * (TAU / n) * 0.35;
      const rad = lerp(r0, r1, r());
      out.push({
        x: Math.cos(a) * rad, z: Math.sin(a) * rad,
        w: hx + r() * 1.5, d: hx + r() * 1.5,
        h: lerp(h0, h1, r() ** 0.75),
        hue, seed: Math.floor(r() * 99999),
      });
    }
  };
  // hero ring: the near towers that frame the kaiju (a dense near skyline)
  ring(14, 19.5, 24, 20, 32, 2.0, 0.25, 0);
  // mid ring
  ring(26, 34, 50, 13, 28, 2.9, 0.12, 1);
  // far ring
  ring(38, 54, 78, 8, 22, 3.6, 0.05, 0);
  // the horizon: a distant skyline so the city does not end in a void
  ring(26, 86, 112, 10, 26, 4.2, 0.0, 1);
  return out;
})();
const HERO = CITY.slice(0, 14);
// the tower the cable tendril wraps: the hero tower nearest the tendril shot's look point
const WRAP = HERO.reduce((best, b) =>
  (Math.hypot(b.x + 13.5, b.z - 6.5) < Math.hypot(best.x + 13.5, best.z - 6.5) ? b : best), HERO[0]);

// windows: a deterministic lit pattern on every face
function windowsOf(b) {
  if (b.win) return b.win;
  const r = mulberry32(b.seed + 7);
  const cols = 3, rows = Math.max(3, Math.min(6, Math.floor(b.h / 3.4)));
  const list = [];
  for (let f = 0; f < 4; f++) {
    for (let c = 0; c < cols; c++) {
      for (let q = 0; q < rows; q++) {
        list.push({ f, c, q, lit: r() });
      }
    }
  }
  b.win = list;
  b.winRows = rows; b.winCols = cols;
  return list;
}

// =====================================================================================
// shots
// =====================================================================================
const SHOTS = [
  // one shot per cut; every cut lands on a bar line
  { bar: 1, bars: 1, kind: 'slam' },
  { bar: 2, bars: 2, kind: 'tiltup' },
  { bar: 4, bars: 1, kind: 'eye' },
  { bar: 5, bars: 1, kind: 'tendril' },
  { bar: 6, bars: 1, kind: 'build' },
  { bar: 7, bars: 1, kind: 'reveal' },
  { bar: 8, bars: 1, kind: 'rave' },
  { bar: 9, bars: 1, kind: 'feet' },
  { bar: 10, bars: 1, kind: 'face' },
  { bar: 11, bars: 1, kind: 'skyline' },
  { bar: 12, bars: 2, kind: 'roofs' },
  { bar: 14, bars: 1, kind: 'endcard' },
];
const shotStart = (s) => barT(s.bar);
function currentShot(t) {
  for (let i = SHOTS.length - 1; i >= 0; i--) if (t >= shotStart(SHOTS[i]) - 1e-9) return SHOTS[i];
  return SHOTS[0];
}
const lerpP = (a, b, u) => ({ x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u), z: lerp(a.z, b.z, u) });
function shotCamera(s, u, t) {
  const P = (x, y, z) => ({ x, y, z });
  const roll = (v) => v;
  switch (s.kind) {
    case 'slam':
      return makeCam(P(6.0 + 1.3 * u, 2.2 + 0.7 * u, 11.6 - 1.2 * u),
                      P(5.5, 1.9 + 0.5 * u, 0.6), 62, roll(0.04 * Math.sin(u * 6)));
    case 'tiltup':
      return makeCam(P(-6.4 - 1.2 * u, 1.4 + 0.4 * u, 11.5 - 1.5 * u),
                      P(1.2 + 1.2 * u, 4.5 + 12 * u ** 1.2, -2 - 2 * u), 58, roll(0.025 * u));
    case 'eye':
      return makeCam(P(0, 27.6 + 0.5 * u, 13.5 - 2.5 * u), P(0, 28.9, 0.4), 46, roll(0.02 * u));
    case 'tendril':
      return makeCam(P(9 - 1.5 * u, 12.5 + 0.8 * u, 20.5 - 2 * u), P(-12, 20, 6), 60, roll(-0.03 * u));
    case 'build':
      return makeCam(P(11 + 4 * u, 6.4 + 4.4 * u, 21 + 8 * u), P(0, 7.5 + 5 * u, 0), 58, roll(0.11 * u * u));
    case 'reveal':
      return makeCam(P(0, 11 + 6 * u, 24 + 10 * u), P(0, 9 + 15 * u, 0), 60, 0);
    case 'rave': {
      const a = 0.10 + 0.34 * u;
      const R = lerp(40, 35, u);
      return makeCam(P(Math.sin(a) * R, lerp(11, 14.5, u), Math.cos(a) * R), P(0, 14, 0), 57, 0);
    }
    case 'feet':
      return makeCam(P(-9.5 + 0.8 * u, 3.0 + 0.3 * u, 13.8 - 0.6 * u), P(0.6, 3.6 + 0.4 * u, 0), 60, roll(0.025));
    case 'face':
      return makeCam(P(1.6 - 1.6 * u, 30.2 + 0.9 * u, 24 - 4.5 * u), P(0, 33.5, 1.0), 46, roll(0.02 * u));
    case 'skyline':
      return makeCam(P(25 - 7 * u, 38, 29 - 4 * u), P(0, 21, 0), 60, roll(-0.02 * u));
    case 'roofs':
      return makeCam(P(27 - 4 * u, 31 + 1.5 * u, 28 - 3 * u), P(9, 20.5, 7), 58, roll(0.03 * Math.sin(u * 3)));
    case 'endcard':
      return makeCam(P(0, 15.5, 33 + 8 * u), P(0, 13.5 + 1.5 * u, 0), 55, 0);
    default:
      return makeCam(P(0, 12, 34), P(0, 12, 0), 58, 0);
  }
}
/** camera for a time, including the shake */
function cameraAt(t) {
  const s = currentShot(t);
  const u = clamp((t - shotStart(s)) / (s.bars * BAR), 0, 1);
  const cam = shotCamera(s, u, t);
  const amp = { slam: 0.62, tiltup: 0.16, eye: 0.10, tendril: 0.16, build: 0.26,
                reveal: 0.95, rave: 0.40, feet: 0.62, face: 0.34, skyline: 0.30, roofs: 0.26, endcard: 0.30 }[s.kind] || 0.3;
  const sh = shakeAt(t, amp);
  // jitter in camera space: sideways + up, plus a tiny roll
  const j1 = Math.sin(t * 71.3) + 0.6 * Math.sin(t * 137.1);
  const j2 = Math.cos(t * 61.7) + 0.6 * Math.sin(t * 111.3);
  const roll = cam.cr !== 1 ? Math.atan2(cam.sr, cam.cr) : 0;
  return makeCam(
    { x: cam.ex + (cam.rx * j1 + cam.ux * j2 * 0.8) * sh,
      y: cam.ey + (cam.ry * j1 + cam.uy * j2 * 0.8) * sh,
      z: cam.ez + (cam.rz * j1 + cam.uz * j2 * 0.8) * sh },
    { x: cam.ex + cam.fx * 10 + cam.rx * j2 * sh * 0.5,
      y: cam.ey + cam.fy * 10 + cam.uy * j2 * sh * 0.5,
      z: cam.ez + cam.fz * 10 + cam.rz * j2 * sh * 0.5 },
    (Math.atan(cam.fpx / (H / 2)) * 360) / Math.PI,
    roll + j1 * sh * 0.006,
  );
}

// safety: no building may sit on a camera eye (sampled over the whole episode)
const CAM_SAMPLES = (() => {
  const out = [];
  for (let i = 0; i * (1 / 20) < DUR; i++) {
    const t = i / 20;
    const s = currentShot(t);
    const u = clamp((t - shotStart(s)) / (s.bars * BAR), 0, 1);
    out.push(shotCamera(s, u, t));
  }
  return out;
})();
const SOLID = CITY.filter((b) => !CAM_SAMPLES.some((c) =>
  Math.abs(c.ex - b.x) < b.w + 3.4 && Math.abs(c.ez - b.z) < b.d + 3.4 && c.ey < b.h + 3.4));

// =====================================================================================
// kaiju (built from speaker cones)
// =====================================================================================
function strokeLoop(cam, pts) {
  if (!poly(cam, pts, true)) return false;
  ctx.stroke();
  return true;
}
/** A truncated cone between two world points: dark body, bright rim, cone rings and ribs. */
function coneFill(cam, bot, top, r0, r1, segs, edge, alpha, rings) {
  const c0 = circle(bot.x, bot.y, bot.z, r0, segs, 'y');
  const c1 = circle(top.x, top.y, top.z, r1, segs, 'y');
  const s0 = c0.map((p) => toScreen(cam, p.x, p.y, p.z));
  const s1 = c1.map((p) => toScreen(cam, p.x, p.y, p.z));
  if (s0.some((q) => !q) || s1.some((q) => !q)) return;
  // the body: a dark, near-opaque mass so the city does not read through it
  ctx.globalAlpha = alpha;
  ctx.fillStyle = 'rgba(9,10,24,0.965)';
  for (let i = 0; i < segs; i++) {
    const j = (i + 1) % segs;
    ctx.beginPath();
    ctx.moveTo(s0[i].x, s0[i].y);
    ctx.lineTo(s1[i].x, s1[i].y);
    ctx.lineTo(s1[j].x, s1[j].y);
    ctx.lineTo(s0[j].x, s0[j].y);
    ctx.closePath();
    ctx.fill();
  }
  // the speaker mouth (the top rim) is the bright edge
  ctx.strokeStyle = edge;
  ctx.globalAlpha = alpha;
  ctx.lineWidth = 3;
  strokeLoop(cam, c1);
  ctx.globalAlpha = alpha * 0.45;
  ctx.lineWidth = 1.6;
  strokeLoop(cam, c0);
  // concentric cone rings
  if (rings) {
    for (let k = 1; k <= 2; k++) {
      const f = k * 0.3;
      ctx.globalAlpha = alpha * (0.34 - k * 0.1);
      ctx.lineWidth = 1.4;
      strokeLoop(cam, circle(lerp(bot.x, top.x, f), lerp(bot.y, top.y, f), lerp(bot.z, top.z, f),
        lerp(r0, r1, f) * 0.86, segs, 'y'));
    }
  }
  // ribs
  ctx.globalAlpha = alpha * 0.5;
  ctx.lineWidth = 1.2;
  for (let i = 0; i < segs; i += 3) {
    ctx.beginPath();
    ctx.moveTo(s0[i].x, s0[i].y);
    ctx.lineTo(s1[i].x, s1[i].y);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.lineWidth = 2;
}

const KA = { // kaiju state for the current frame
  stand: 0.4, hip: 11, top: 24, liftL: 0, liftR: 0, lean: 0, bow: 0, eyeOpen: 0, pump: 0,
};
// proportions (standing): feet 0, hip 17, shoulders 30, head 30..37.5
function kaijuState(t) {
  const kp = kickPulse(t, 10);
  const e = energy(t);
  const st = standAt(t);
  const hip = lerp(7.4, 17.0, st);
  const top = hip + lerp(9.5, 20.5, st);
  // stomping: a foot lands on every kick, alternating right / left
  let liftL = 0, liftR = 0;
  const stomping = smooth(DROP_T - 0.05, DROP_T + 0.35, t);
  if (stomping > 0) {
    const bi = kickIndex(t);
    const ph = kickPhase(t);
    const rise = Math.max(0, Math.sin(Math.PI * clamp((ph - 0.5) / 0.5, 0, 1)));
    const h = 6.2 * rise * stomping;
    if (bi % 2 === 0) liftR = h; else liftL = h;
  }
  KA.stand = st; KA.hip = hip; KA.top = top;
  KA.liftL = liftL; KA.liftR = liftR;
  KA.lean = (liftR - liftL) * 0.28;
  KA.bow = 0.6 * smooth(barT(13) + 0.9, barT(13) + 1.9, t);
  KA.eyeOpen = clamp(0.12 + 0.55 * smooth(barT(3) + 0.2, barT(4) + 0.6, t) + e * 0.45, 0, 1);
  KA.pump = kp * (0.45 + 0.55 * e);
  return KA;
}
function drawKaiju(cam, t, alpha) {
  const st = kaijuState(t);
  const neon = smooth(DROP_T, DROP_T + 0.55, t);
  const edA = '#2ae8ff';
  const edB = neon > 0.45 ? '#ff3ce6' : '#8f7dff';
  const pump = st.pump;
  const hipX = st.lean, hipZ = 0;
  // ---------------------------------------------------------------- legs + feet
  for (const side of [-1, 1]) {
    const lift = side < 0 ? st.liftL : st.liftR;
    const fx = side * 6.4;
    const ed = side < 0 ? edA : edB;
    coneFill(cam, { x: fx, y: lift + 1.4, z: 0.3 }, { x: hipX + side * 2.0, y: st.hip + 0.4, z: hipZ },
      4.0, 3.3, 10, ed, alpha, false);
    // the foot: a slab with three toe cones
    const fy = lift + 1.4, fz = 0.3, fs = 3.4;
    const lo = [{ x: fx - fs, y: fy, z: fz - fs * 1.5 }, { x: fx + fs, y: fy, z: fz - fs * 1.5 },
                { x: fx + fs, y: fy, z: fz + fs * 1.4 }, { x: fx - fs, y: fy, z: fz + fs * 1.4 }];
    const hi = lo.map((p) => ({ x: p.x, y: fy + 1.8, z: p.z }));
    ctx.globalAlpha = alpha;
    const sp = hi.map((p) => toScreen(cam, p.x, p.y, p.z));
    if (sp.every((q) => q)) {
      ctx.beginPath();
      ctx.moveTo(sp[0].x, sp[0].y);
      for (let i = 1; i < 4; i++) ctx.lineTo(sp[i].x, sp[i].y);
      ctx.closePath();
      ctx.fillStyle = 'rgba(12,13,28,0.97)';
      ctx.fill();
    }
    ctx.strokeStyle = ed;
    ctx.lineWidth = 2.6;
    polyStroke(cam, hi, true);
    ctx.globalAlpha = alpha * 0.5;
    ctx.lineWidth = 1.4;
    polyStroke(cam, lo, true);
    for (let i = 0; i < 4; i++) strokeSeg(cam, lo[i], hi[i]);
    // toes
    for (let i = 0; i < 3; i++) {
      const tx = fx - fs * 0.65 + i * fs * 0.65;
      const tz = fz - fs * 1.5 - 1.6;
      coneFill(cam, { x: tx, y: fy + 0.2, z: tz + 1.2 }, { x: tx, y: fy + 0.2, z: tz - 0.6 },
        0.95, 0.55, 7, ed, alpha * 0.85, false);
    }
  }
  // ---------------------------------------------------------------- torso: stacked woofers
  const segs = 14;
  const N = 4;
  for (let i = 0; i < N; i++) {
    const y0 = lerp(st.hip + 0.6, st.top, i / N);
    const y1 = lerp(st.hip + 0.6, st.top, (i + 1) / N);
    const r0 = lerp(8.6, 5.4, i / N) * (1 + 0.10 * pump);
    const r1 = lerp(8.6, 5.4, (i + 1) / N);
    const wob = Math.sin(t * 22 + i * 1.3) * 0.1 * pump;
    coneFill(cam, { x: hipX + wob, y: y0, z: hipZ }, { x: hipX - wob, y: y1, z: hipZ }, r0, r1, segs,
      i % 2 ? edB : edA, alpha, true);
  }
  // ---------------------------------------------------------------- shoulder pods + cable arms
  const shY = lerp(st.hip, st.top, 0.86);
  for (const side of [-1, 1]) {
    const sx = hipX + side * 6.6;

      // the word that is already cracked on frame 1: the shards have popped apart
      if (w.crackBoost) {
        const bo = w.crackBoost * clamp(a / 0.09, 0, 1);
        ox += Math.sign(s.cx) * bo * 0.8;
        oy += Math.sign(s.cy) * bo * 0.5;
        rot += Math.sign(s.cx) * bo * 0.0012;
      }
    }
    const dw = s.sw, dh = s.sh;
    const dx = ox - dw / 2, dy = oy - dh / 2;
    ctx.save();
    if (rot) { ctx.translate(ox, oy); ctx.rotate(rot); ctx.translate(-ox, -oy); }
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = alpha * 0.9;
    ctx.drawImage(w.cyan, s.sx, s.sy, s.sw, s.sh, dx + split, dy, dw, dh);
    ctx.drawImage(w.red, s.sx, s.sy, s.sw, s.sh, dx - split, dy, dw, dh);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = alpha;
    ctx.drawImage(w.cv, s.sx, s.sy, s.sw, s.sh, dx, dy, dw, dh);
    // crack seams right after the impact
    if (a > slam * 0.55 && a < slam + 0.26 && s.sw > 6) {
      ctx.globalAlpha = alpha * 0.4 * clamp(1 - Math.max(0, a - slam) / 0.26, 0, 1);
      ctx.strokeStyle = '#dffcff';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(dx, dy, dw, dh);
    }
    ctx.restore();
  }
  // the impact flash on the slam frame
  if (a < 0.04) {
    ctx.globalAlpha = clamp(1 - a / 0.04, 0, 1) * 0.16;
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-iw / 2, -ih / 2, iw, ih);
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

// ---------------------------------------------------------------- overlays
const scanPat = (() => {
  const c = document.createElement('canvas');
  c.width = 3; c.height = 3;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(0,0,0,0.5)';
  g.fillRect(0, 0, 3, 1);
  return ctx.createPattern(c, 'repeat');
})();
let bgGrad = null, vigGrad = null, rollGrad = null, hazeGrad = null;
function ensureGrads() {
  if (bgGrad) return;
  bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#01030a');
  bgGrad.addColorStop(0.45, '#05060f');
  bgGrad.addColorStop(0.75, '#0a0718');
  bgGrad.addColorStop(1, '#02030a');
  vigGrad = ctx.createRadialGradient(W / 2, H * 0.5, H * 0.18, W / 2, H * 0.5, H * 0.72);
  vigGrad.addColorStop(0, 'rgba(0,0,0,0)');
  vigGrad.addColorStop(1, 'rgba(0,0,0,0.82)');
  rollGrad = ctx.createLinearGradient(0, 0, 0, 220);
  rollGrad.addColorStop(0, 'rgba(255,255,255,0)');
  rollGrad.addColorStop(0.5, 'rgba(190,240,255,0.055)');
  rollGrad.addColorStop(1, 'rgba(255,255,255,0)');
  hazeGrad = ctx.createRadialGradient(W / 2, H * 0.58, 40, W / 2, H * 0.58, H * 0.6);
  hazeGrad.addColorStop(0, 'rgba(60,20,90,0.5)');
  hazeGrad.addColorStop(1, 'rgba(0,0,0,0)');
}
function drawOverlays(t) {
  const neon = smooth(DROP_T, DROP_T + 0.6, t);
  ctx.globalAlpha = 0.35 + 0.5 * neon;
  ctx.fillStyle = hazeGrad;
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;
  ctx.fillStyle = vigGrad;
  ctx.fillRect(0, 0, W, H);
  // scanlines
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = scanPat;
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;
  // CRT roll bar
  const ry = ((t * 150) % (H + 300)) - 220;
  ctx.save();
  ctx.translate(0, ry);
  ctx.fillStyle = rollGrad;
  ctx.fillRect(0, 0, W, 220);
  ctx.restore();
}
function drawGlitch(t) {
  // 4-frame tear on every bar cut, stronger at the drop
  const cut = Math.floor(t / BAR) * BAR;
  const since = (t - cut) * FPS;
  const atDrop = Math.abs(cut - DROP_T) < 1e-6;
  const n = atDrop ? 7 : 4;
  if (since > n) return;
  const seed = Math.floor(cut * 100);
  const rnd = mulberry32(seed);
  const slices = atDrop ? 11 : 6;
  const amp = (atDrop ? 34 : 16) * (1 - since / n);
  for (let i = 0; i < slices; i++) {
    const y = Math.floor(rnd() * H);
    const h = 8 + Math.floor(rnd() * 46);
    const dx = (rnd() * 2 - 1) * amp;
    ctx.drawImage(cv, 0, y, W, h, dx, y, W, h);
  }
  // a bright tear line and a white flash
  const fy = Math.floor(rnd() * H);
  ctx.globalAlpha = 0.16 * (1 - since / n);
  ctx.fillStyle = '#cfefff';
  ctx.fillRect(0, fy, W, 3);
  // a hard white flash only on the drop frame; other cuts get the tear lines alone
  if (atDrop && since < 1) {
    ctx.globalAlpha = 0.24 * (1 - since);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
  }
  ctx.globalAlpha = 1;
}
function drawTendril(cam, t) {
  // a cable from the kaiju's shoulder that wraps the tower
  const st = kaijuState(t);
  const shY = lerp(st.hip, st.top, 0.82);
  const a = { x: 4.6, y: shY - 1.6, z: -1.4 };
  const b = { x: WRAP.x, y: WRAP.h - 2.6, z: WRAP.z };
  const pa = toScreen(cam, a.x, a.y, a.z), pb = toScreen(cam, b.x, b.y, b.z);
  if (!pa || !pb) return;
  const kp = kickPulse(t, 9);
  const segs = 16;
  ctx.strokeStyle = '#ff2bd6';
  ctx.lineWidth = 4;
  ctx.globalAlpha = 0.9;
  ctx.beginPath();
  for (let i = 0; i <= segs; i++) {
    const u = i / segs;
    const wob = Math.sin(u * 9 + t * 4) * 14 * (1 - u) * (0.6 + 0.8 * kp);
    const x = lerp(pa.x, pb.x, u) + wob * 0.4;
    const y = lerp(pa.y, pb.y, u) + wob - Math.sin(u * Math.PI) * 22;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.strokeStyle = '#ffd6f5';
  ctx.lineWidth = 1.4;
  ctx.stroke();
  // the coil around the tower, tightening on the kick
  const tighten = 0.2 + 0.8 * smooth(barT(5) + 0.6, barT(5) + 1.6, t);
  const mid = toScreen(cam, WRAP.x, WRAP.h - 2.0, WRAP.z);
  if (mid) {
    const rx = Math.abs(cam.fpx / mid.z) * (WRAP.w * 1.45) * (1.25 - 0.22 * tighten);
    const ry2 = rx * 0.3 * (0.4 + cam.fy * 2);
    for (let i = 0; i < 5; i++) {
      const yy = mid.y - 26 + i * 13 + Math.sin(t * 6 + i) * 3 * kp;
      ctx.beginPath();
      ctx.ellipse(mid.x, yy, rx * 0.5, Math.max(3, ry2 * 0.5), 0, 0, TAU);
      ctx.globalAlpha = 0.85 - i * 0.1;
      ctx.strokeStyle = i % 2 ? '#ff2bd6' : '#ff9de8';
      ctx.lineWidth = 3.4;
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}
function drawEmergencyBar(t) {
  const on = smooth(barT(6) - 0.3, barT(6) + 0.2, t) * (1 - smooth(DROP_T - 0.2, DROP_T, t));
  if (on < 0.02) return;
  const y = H * 0.135, h = 84;
  ctx.globalAlpha = 0.9 * on;
  ctx.fillStyle = 'rgba(30,0,6,0.85)';
  ctx.fillRect(0, y, W, h);
  ctx.strokeStyle = '#ff2b3b';
  ctx.lineWidth = 3;
  ctx.strokeRect(0, y, W, h);
  const msg = '!! EMERGENCY BROADCAST !! GIANT SPEAKER SIGNATURE INBOUND !! DO NOT APPROACH THE STREET !! ';
  ctx.font = '700 46px "DejaVu Sans Condensed","DejaVu Sans",sans-serif';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ff5566';
  const tw = ctx.measureText(msg).width;
  let x = -((t * 260) % tw);
  while (x < W) { ctx.fillText(msg, x, y + h / 2 + 2); x += tw; }
  ctx.globalAlpha = 0.18 * on;
  ctx.fillStyle = '#ff0018';
  ctx.fillRect(0, y, W, h);
  ctx.globalAlpha = 1;
}
function drawCrowd(cam, t) {
  const kp = kickPhase(t);
  const jump = 1.5 * Math.max(0, Math.sin(Math.PI * clamp((kp - 0.08) / 0.72, 0, 1)));
  const rnd = mulberry32(5150);
  for (const b of HERO) {
    const c = toScreen(cam, b.x, b.h + 1, b.z);
    if (!c || c.x < 40 || c.x > W - 40 || c.y < 120 || c.y > H - 260) continue;
    if (c.z < 8) continue;
    const n = 3 + Math.floor(rnd() * 3);
    for (let i = 0; i < n; i++) {
      const u = (i + 0.5) / n;
      // along the roof edge that faces the camera
      const p = { x: b.x + (u - 0.5) * b.w * 1.5, y: b.h + jump * (0.85 + 0.3 * rnd()), z: b.z + b.d * 0.55 };
      const a = toScreen(cam, p.x, p.y, p.z);
      const b2 = toScreen(cam, p.x, p.y + 1.6, p.z);
      if (!a || !b2) continue;
      const lw = clamp((cam.fpx * 0.85) / a.z, 3, 22);
      // a rim light so the silhouette reads against the dark city
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#39e9ff';
      ctx.globalAlpha = 0.55;
      ctx.lineWidth = lw + 5;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b2.x, b2.y); ctx.stroke();
      ctx.strokeStyle = '#04050c';
      ctx.globalAlpha = 1;
      ctx.lineWidth = lw;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b2.x, b2.y); ctx.stroke();
      const hd = toScreen(cam, p.x, p.y + 2.1, p.z);
      if (hd) {
        ctx.beginPath(); ctx.arc(hd.x, hd.y, lw * 0.6 + 2.2, 0, TAU);
        ctx.fillStyle = '#39e9ff'; ctx.globalAlpha = 0.55; ctx.fill();
        ctx.beginPath(); ctx.arc(hd.x, hd.y, lw * 0.6, 0, TAU);
        ctx.fillStyle = '#04050c'; ctx.globalAlpha = 1; ctx.fill();
      }
      // raised arms on the jump
      if (jump > 0.45) {
        ctx.lineWidth = lw * 0.5;
        ctx.strokeStyle = '#04050c';
        ctx.beginPath(); ctx.moveTo(b2.x, b2.y); ctx.lineTo(b2.x - lw * 1.7, b2.y - lw * 2.4); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(b2.x, b2.y); ctx.lineTo(b2.x + lw * 1.7, b2.y - lw * 2.4); ctx.stroke();
      }
    }
  }
  ctx.lineCap = 'butt';
  ctx.globalAlpha = 1;
}
// =====================================================================================
// frame
// =====================================================================================
function seek(t) {
  t = clamp(t, 0, DUR + 0.001);
  ensureGrads();
  for (const w of WORDS) if (!w.cv) buildWord(w);
  const cam = cameraAt(t);
  const neon = smooth(DROP_T, DROP_T + 0.6, t);
  // background
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  if (neon > 0.01) {
    ctx.globalAlpha = 0.5 * neon;
    ctx.fillStyle = hazeGrad;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  const s = currentShot(t);
  drawGround(cam, t);
  drawCity(cam, t);
  drawRings(cam, t);
  // the creature is legible from frame 1 (its foot IS the hook); after the drop it goes full strength
  const alpha = clamp(0.82 + 0.18 * energy(t), 0, 1);
  drawKaiju(cam, t, alpha);
  if (s.kind === 'tendril') drawTendril(cam, t);
  if (s.kind === 'roofs') drawCrowd(cam, t);
  if (s.kind === 'build' || s.kind === 'slam') drawEmergencyBar(t);
  for (const w of WORDS) drawWord(cam, w, t);
  drawOverlays(t);
  drawGlitch(t);
  if (window.MXDEBUG) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.font = '26px monospace';
    ctx.fillStyle = '#00ff66';
    let yy = 70;
    for (const w of WORDS) {
      if (t < w.t0 - 0.02 || t > wordEnd(w)) continue;
      ctx.fillText(`${w.id} ${w.cv.width}x${w.cv.height} a=${(t - w.t0).toFixed(3)} y=${(H * w.y).toFixed(0)}`, 24, yy);
      yy += 32;
      const hw = (w.cv.width / 2) * (t - w.t0 < (w.slamDur === undefined ? 0.1 : w.slamDur) ? 3 : 1.1);
      ctx.strokeStyle = '#ff0';
      ctx.strokeRect(W / 2 - hw, H * w.y - 60, hw * 2, 120);
    }
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

window.__motion = {
  ready: false,
  duration: DUR,
  size: { width: W, height: H },
  seek,
};
(async () => {
  try { await document.fonts.ready; } catch (e) { /* ignore */ }
  window.__motion.ready = true;
})();
})();
</script>
</body>
