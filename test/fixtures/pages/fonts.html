<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <title>fonts</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 320px;
        height: 180px;
        overflow: hidden;
        background: rgb(0, 0, 255);
      }
      #label {
        /* system stack only: nothing is fetched, so the page renders offline too */
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 28px;
        line-height: 1;
        color: #fff;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <div id="label">motionex fonts</div>
    <script>
      // ready only after document.fonts.ready: the capture tool must not screenshot fallback metrics.
      const WIDTH = 320;
      const HEIGHT = 180;
      const DURATION = 1;
      const apply = (t) => {
        const k = Math.round(255 * Math.max(0, Math.min(DURATION, t)));
        document.body.style.background = `rgb(${k}, 0, ${255 - k})`;
      };
      const motion = {
        ready: false,
        duration: DURATION,
        size: { width: WIDTH, height: HEIGHT },
        seek(t) {
          apply(t);
        },
      };
      window.__motion = motion;
      motion.seek(0);
      Promise.resolve(document.fonts?.ready).then(() => {
        motion.ready = true;
      });
    </script>
  </body>
</html>
